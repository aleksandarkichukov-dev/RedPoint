# The only thing listening on the public internet.
#
# Everything behind it — the storefront, Medusa, the admin — binds inside the
# compose network and is never published directly. The ports in
# docker-compose.yml are there for a laptop; on the VPS they should be removed
# so that a misconfigured firewall cannot expose Medusa's admin API on 9000.
#
# One domain, three destinations:
#   /            the shop
#   /app         the Medusa admin
#   /store, /admin, /auth, /hooks, /static   the Medusa API
#
# Same origin for all of them on purpose. The alternative — admin.redpointbg.com
# — means CORS on every admin call, cookies scoped to two hosts, and a second
# certificate. One origin costs a few location blocks and nothing else.

upstream storefront {
    server storefront:3000;
}

upstream medusa {
    server backend:9000;
}

# The OLD domain. This block is the whole reason the shop keeps its ten years.
#
# The move is to a different domain, not a different server, so the 301 map in
# next.config.ts is not enough on its own: those rules match on path and only
# fire for requests that reach this server. red-point.bg has to point here in
# DNS as well, or every link, bookmark and search result made since 2014 lands
# on whatever is left at the old host — and the redirects, the sitemap and the
# rest of that work count for nothing.
#
# Two hops for an old product URL, which is expected and fine:
#   red-point.bg/product/16370/…  ->  redpointbg.com/product/16370/…  (here)
#                                 ->  redpointbg.com/p/{handle}       (Next)
#
# Keep this block for years, not months. Link equity moves slowly and the
# people with the old address bookmarked move slower.
server {
    listen 80;
    listen [::]:80;
    server_name red-point.bg www.red-point.bg;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://redpointbg.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name red-point.bg www.red-point.bg;

    # The old domain needs its own certificate, on the same server. Issue it in
    # the same certbot run as the new one; a browser arriving over HTTPS at the
    # old address gets a warning before it ever sees the redirect otherwise.
    ssl_certificate     /etc/letsencrypt/live/redpointbg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/redpointbg.com/privkey.pem;

    return 301 https://redpointbg.com$request_uri;
}

# Plain HTTP: the ACME challenge, and a redirect for everything else.
server {
    listen 80;
    listen [::]:80;
    server_name redpointbg.com www.redpointbg.com;

    # Let's Encrypt writes its proof here and reads it back over port 80. This
    # location must stay above the redirect, or the renewal follows itself to
    # HTTPS and fails with a certificate that has not been issued yet.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://redpointbg.com$request_uri;
    }
}

# www to the bare domain, so the shop has one address rather than two that
# search engines have to be told are the same.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.redpointbg.com;

    ssl_certificate     /etc/letsencrypt/live/redpointbg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/redpointbg.com/privkey.pem;

    return 301 https://redpointbg.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name redpointbg.com;

    ssl_certificate     /etc/letsencrypt/live/redpointbg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/redpointbg.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # A photo archive is up to 150 MB, matching the multer cap in
    # apps/backend/src/api/middlewares.ts. nginx defaults to 1 MB and rejects
    # the upload itself with a bare 413 — no Bulgarian, no explanation, and the
    # shop is left staring at a screen that says nothing. Keep the two numbers
    # in step.
    client_max_body_size 150m;

    # Long enough for the bulk import, which writes hundreds of variants in one
    # transaction and legitimately takes minutes. The default 60s cuts it off
    # midway and the admin shows a gateway error for an import that is still
    # running and will succeed.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Off, because it names the version to anyone asking.
    server_tokens off;

    # Sent on every response below. Deliberately modest: this shop has no
    # inline-script budget to spend on a strict CSP, and a wrong CSP breaks the
    # checkout rather than protecting it.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Only after the first certificate renews cleanly. Enabled early, a broken
    # certificate locks every returning browser out of the shop for its
    # duration, and there is no way to take it back.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Medusa ------------------------------------------------------------
    # Named locations rather than one catch-all, so anything Medusa adds later
    # is unreachable until somebody decides it should be reachable.
    location ~ ^/(app|store|admin|auth|hooks|static)(/|$) {
        proxy_pass http://medusa;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    # --- the shop ----------------------------------------------------------
    location / {
        proxy_pass http://storefront;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    # Next's own build output is content-hashed, so it can be cached hard. This
    # is the one caching rule worth having: without it every page load re-fetches
    # the JavaScript bundle through the proxy, on a server with two cores.
    location /_next/static/ {
        proxy_pass http://storefront;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
